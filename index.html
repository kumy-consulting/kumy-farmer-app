<!doctype html>
<html lang="fr" style="color-scheme: light; background: #f7f4e9">
  <head>
    <meta charset="UTF-8" />
    <!-- Contextes CARRÉS : la marque seule. Le verrou « pousse + kumy » est
         large (340×250) et deviendrait illisible réduit à 16 ou 180 px. -->
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#018675" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="L'application des agriculteurs Kumy : mes cultures, mes alertes, ma météo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kumy" />

    <!-- Police Ubuntu embarquée via @fontsource, importée dans main.tsx. -->

    <title>Kumy — Mon exploitation</title>
  </head>
  <body style="margin: 0; background: #f7f4e9">
    <style>
      /*
        Écran d'attente Kumy. Volontairement HORS de #root : React efface le
        contenu de #root à son premier rendu, et `App` ne rend rien tant que la
        session n'est pas initialisée — un loader placé dedans laisserait donc un
        écran vide pendant toute l'authentification.
        Il est retiré explicitement par `dismissBootSplash()`.
      */
      #kumy-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 28px;
        font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        background: linear-gradient(180deg, #f7f4e9 0%, #edf3ea 34%, #d9e7db 68%, #bed4c0 100%);
        opacity: 1;
        transition: opacity 420ms ease;
      }
      #kumy-splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }

      .ks-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: 340px;
        height: 340px;
        max-width: 78vw;
        max-height: 78vw;
      }

      /*
        La signature de l'écran, et le vocabulaire même de l'app : une PARCELLE
        sous le RAYON DE COUVERTURE d'une station, que l'agriculteur retrouve
        tracés sur ses cartes. Chaque forme dit quelque chose — aucune n'est là
        pour décorer.
      */
      .ks-plan {
        position: absolute;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #018675;
        stroke-width: 1;
      }
      /* La parcelle. Immobile : la terre ne bouge pas, c'est le capteur qui passe. */
      .ks-parcelle {
        stroke-opacity: 0.24;
        /* Tirets plus serrés que ceux du rayon : la parcelle est un bornage
           relevé sur le terrain, le rayon une portée calculée. Deux objets
           différents ne se dessinent pas du même trait. */
        stroke-dasharray: 2 3.2;
        stroke-linejoin: round;
      }
      /* Le rayon couvert par la station. Dérive très lentement. */
      .ks-couverture {
        stroke-opacity: 0.3;
        stroke-dasharray: 3 4.5;
        transform-origin: 50% 50%;
        animation: ksRotation 96s linear infinite;
      }
      /*
        Le passage de la station. C'est LUI l'indicateur de chargement : il
        remplace les trois points, et dit « relevé en cours » plutôt que « ça
        charge ». Une tête vive suivie d'une traînée, à vitesse constante — un
        balayage, pas un spinner.

        Circonférence de r=94 : 590,6. Chaque paire de tirets la totalise, et la
        traînée est décalée de -517 pour se placer DERRIÈRE la tête.
      */
      .ks-passage {
        transform-origin: 50% 50%;
        animation: ksRotation 4.2s linear infinite;
      }
      .ks-trainee,
      .ks-tete {
        stroke-width: 2.4;
        stroke-linecap: round;
      }
      .ks-trainee {
        stroke-opacity: 0.16;
        stroke-dasharray: 74 517;
        stroke-dashoffset: -517;
      }
      .ks-tete {
        stroke-opacity: 0.62;
        stroke-dasharray: 16 575;
      }

      /* Assoit le mot-symbole bleu ardoise sur le dégradé vert. */
      .ks-halo {
        position: absolute;
        width: 62%;
        height: 62%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0) 70%);
      }
      .ks-logo {
        position: relative;
        width: 158px;
        /* 40vw : le logo doit rester DANS la parcelle avec de l'air autour.
           Au-delà, il en touche les bords sur un écran de 360 px. */
        max-width: 40vw;
        height: auto;
      }

      .ks-eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 32px 0 0;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #018675;
      }
      .ks-eyebrow::before,
      .ks-eyebrow::after {
        content: '';
        width: 18px;
        height: 1px;
        background: rgba(1, 134, 117, 0.42);
      }

      /* Seule italique de l'app : elle signe cette phrase et rien d'autre. */
      .ks-tagline {
        margin: 14px 0 0;
        font-size: 13.5px;
        font-weight: 300;
        font-style: italic;
        line-height: 1.6;
        color: #4a6360;
      }

      /* Ancrée en bas pour ne pas décentrer le bloc principal. */
      .ks-mark {
        position: absolute;
        bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 7px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.5);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #35495e;
      }
      .ks-mark::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #41b782;
      }

      @keyframes ksRotation {
        to {
          transform: rotate(360deg);
        }
      }
      /* Sans rotation, le passage doit rester lisible comme signe d'activité :
         il respire au lieu de tourner. */
      @keyframes ksRespire {
        0%,
        100% {
          stroke-opacity: 0.18;
        }
        50% {
          stroke-opacity: 0.62;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ks-couverture {
          animation: none;
        }
        .ks-passage {
          animation: none;
        }
        .ks-tete {
          animation: ksRespire 2.6s ease-in-out infinite;
        }
        #kumy-splash {
          transition: none;
        }
      }
    </style>

    <div id="kumy-splash" role="status" aria-label="Chargement de Kumy">
      <div class="ks-stage">
        <svg class="ks-plan" viewBox="0 0 200 200" aria-hidden="true">
          <polygon class="ks-parcelle" points="100,30 167,68 152,150 57,158 35,82" />
          <circle class="ks-couverture" cx="100" cy="100" r="94" />
          <g class="ks-passage">
            <circle class="ks-trainee" cx="100" cy="100" r="94" />
            <circle class="ks-tete" cx="100" cy="100" r="94" />
          </g>
        </svg>
        <span class="ks-halo" aria-hidden="true"></span>
        <img class="ks-logo" src="/logo-kumy.svg" alt="Kumy" />
      </div>

      <p class="ks-eyebrow">Mon exploitation</p>
      <p class="ks-tagline">L'agriculture de précision,<br />au rythme de vos terres.</p>

      <p class="ks-mark">Suite Kumy · Guinée</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
